name: Server CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BACKUP_TEST_CONNECTION: Host=localhost;Port=5432;Database=paladinhub_ci;Username=postgres;Password=postgres
      SEO_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=paladinhub_ci;Username=postgres;Password=postgres

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paladinhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paladinhub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install PostgreSQL backup tools
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Restore solution
        run: dotnet restore PaladinHubV2.Server.sln

      - name: Restore catalog checks
        run: dotnet restore tests/CatalogModelChecks/CatalogModelChecks.csproj

      - name: Restore unit tests
        run: dotnet restore tests/PaladinHubV2.Server.Tests/PaladinHubV2.Server.Tests.csproj

      - name: Build solution
        run: dotnet build PaladinHubV2.Server.sln --configuration Release --no-restore

      - name: Run catalog model checks
        run: dotnet run --project tests/CatalogModelChecks/CatalogModelChecks.csproj --configuration Release --no-restore

      - name: Enforce 100% SEO refactor line coverage
        run: |
          set +e
          dotnet test --project tests/PaladinHubV2.Server.Tests/PaladinHubV2.Server.Tests.csproj \
            --configuration Release \
            --no-restore \
            --filter "FullyQualifiedName~Seo" \
            /p:SeoRefactorCoverage=true
          status=$?
          if [ -f tests/PaladinHubV2.Server.Tests/coverage/seo-refactor.json ]; then
            python3 - <<'PY'
          import json
          p="tests/PaladinHubV2.Server.Tests/coverage/seo-refactor.json"
          data=json.load(open(p))
          misses=[]
          for assembly,docs in data.items():
              for doc,classes in docs.items():
                  for cls,methods in classes.items():
                      for method,info in methods.items():
                          for line,hits in info.get("Lines",{}).items():
                              if hits == 0:
                                  misses.append((doc,int(line),cls,method))
          print("UNCOVERED_LINES", len(misses))
          for row in sorted(misses):
              print("UNCOVERED", *row, sep=" | ")
          PY
          fi
          exit $status

