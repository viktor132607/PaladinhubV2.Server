name: Server CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: server-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test server
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SEO_POSTGRES_CONNECTION: Host=localhost;Port=5432;Database=paladinhub_ci;Username=postgres;Password=postgres

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: paladinhub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d paladinhub_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore solution
        run: dotnet restore PaladinHubV2.Server.sln

      - name: Restore catalog checks
        run: dotnet restore tests/CatalogModelChecks/CatalogModelChecks.csproj

      - name: Restore unit tests
        run: dotnet restore tests/PaladinHubV2.Server.Tests/PaladinHubV2.Server.Tests.csproj

      - name: Build solution
        run: dotnet build PaladinHubV2.Server.sln --configuration Release --no-restore

      - name: Run catalog model checks
        run: dotnet run --project tests/CatalogModelChecks/CatalogModelChecks.csproj --configuration Release --no-restore

      - name: Run controller and PostgreSQL integration tests
        run: dotnet test --project tests/PaladinHubV2.Server.Tests/PaladinHubV2.Server.Tests.csproj --configuration Release --no-restore
