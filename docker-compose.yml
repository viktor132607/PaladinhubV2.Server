services:
  db:
    image: postgres:16
    container_name: paladinhubv2-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_NAME:-paladinhubv2db}"
      POSTGRES_USER: "${DB_USER:-postgres}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-postgres}"
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-paladinhubv2db}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - paladinhubv2-network

  api:
    container_name: paladinhubv2-api
    build:
      context: .
      dockerfile: PaladinHubV2.Server.API/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: "${ASPNETCORE_ENVIRONMENT:-Development}"
      ASPNETCORE_URLS: "http://0.0.0.0:${PORT:-10000}"
      PORT: "${PORT:-10000}"
      DB_CONNECTION: "Host=db;Port=5432;Database=${DB_NAME:-paladinhubv2db};Username=${DB_USER:-postgres};Password=${DB_PASSWORD:-postgres};"
    ports:
      - "${PORT:-10000}:${PORT:-10000}"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - paladinhubv2-network

networks:
  paladinhubv2-network:
    driver: bridge

volumes:
  postgres-data:
    name: paladinhubv2-postgres-5434-data
